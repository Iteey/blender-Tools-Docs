<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">Negative/mirrored Scale</title>
<desc id="desc">Illustration for Negative/mirrored Scale</desc>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="20" y="20" width="760" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
<text x="40" y="58" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Negative/mirrored Scale</text>
<text x="40" y="84" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Problem illustration</text>
<polygon points="140,185.0 210.0,150 210.0,220.0 210.0,220.0 140,255.0" fill="#0b2239" stroke="#60a5fa" stroke-width="3" fill-opacity="1"/>
<polygon points="210.0,150 280,185.0 280,255.0 210.0,220.0" fill="#123459" stroke="#60a5fa" stroke-width="3" fill-opacity="1"/>
<polygon points="210.0,220.0 280,255.0 210.0,290 210.0,220.0" fill="#0a2946" stroke="#60a5fa" stroke-width="3" fill-opacity="1"/>
<line x1="355" y1="205" x2="470" y2="205" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
<line x1="470" y1="205" x2="461.43111246631054" y2="210.15501371821463" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
<line x1="470" y1="205" x2="461.43111246631054" y2="199.84498628178537" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
<text x="520" y="210" fill="#ef4444" font-size="30" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">X scale = -1</text>
<text x="350" y="250" fill="#94a3b8" font-size="16" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">Negative scale mirrors the object and can flip handedness.</text>
