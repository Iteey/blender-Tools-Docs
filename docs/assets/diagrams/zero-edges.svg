<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">Zero-length edges</title>
<desc id="desc">Illustration for Zero-length edges</desc>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="20" y="20" width="760" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
<text x="40" y="58" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Zero-length edges</text>
<text x="40" y="84" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Problem illustration</text>
<line x1="150" y1="230" x2="280" y2="180" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
<circle cx="280" cy="180" r="8" fill="#38bdf8" stroke="#38bdf8" stroke-width="1"/>
<circle cx="281" cy="181" r="8" fill="#ef4444" stroke="#ef4444" stroke-width="1"/>
<line x1="269" y1="169" x2="293" y2="193" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
<line x1="293" y1="169" x2="269" y2="193" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
<text x="380" y="182" fill="#e5e7eb" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Two edge endpoints coincide</text>
<text x="380" y="215" fill="#94a3b8" font-size="17" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">The edge length becomes zero.</text>
</svg>