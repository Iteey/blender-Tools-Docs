<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">Non-manifold edges</title>
<desc id="desc">Illustration for Non-manifold edges</desc>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="20" y="20" width="760" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
<text x="40" y="58" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Non-manifold edges</text>
<text x="40" y="84" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Problem illustration</text>
<polygon points="150,240 240,160 240,240" fill="#0f3055" stroke="#38bdf8" stroke-width="3" fill-opacity="1"/>
<polygon points="240,160 330,240 240,240" fill="#123459" stroke="#38bdf8" stroke-width="3" fill-opacity="1"/>
<polygon points="240,240 330,240 240,320" fill="#3b1111" stroke="#ef4444" stroke-width="3" fill-opacity="1"/>
<line x1="240" y1="160" x2="240" y2="320" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
<text x="405" y="185" fill="#e5e7eb" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">3 faces share one edge</text>
<text x="405" y="218" fill="#94a3b8" font-size="16" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">The mesh is non-manifold and may fail in tools or export.</text>
</svg>