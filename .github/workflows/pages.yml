name: Build and publish UE5 Tools docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Verify checked-in website files
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/ru/index.html
          test -s docs/en/index.html
          test -s docs/ru/checks/duplicate-faces.html
          test -s docs/en/checks/duplicate-faces.html
          test -s docs/assets/style.css
          test -s docs/assets/app.js
          test -s docs/assets/diagrams/ru/duplicate-faces.svg
          test -s docs/assets/diagrams/en/duplicate-faces.svg
          echo "Prebuilt UE5 Tools documentation is present."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
