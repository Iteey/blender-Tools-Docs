<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">Lightmap UV outside 0-1</title>
<desc id="desc">Illustration for Lightmap UV outside 0-1</desc>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="20" y="20" width="760" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
<text x="40" y="58" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Lightmap UV outside 0-1</text>
<text x="40" y="84" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Problem illustration</text>
<rect x="110" y="110" width="220" height="220" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
<polygon points="170,170 280,150 310,240 210,290" fill="#f59e0b22" stroke="#f59e0b" stroke-width="3"/>
<polygon points="260,80 385,120 355,220 250,190" fill="#ef444422" stroke="#ef4444" stroke-width="3"/>
<text x="420" y="175" fill="#e5e7eb" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Lightmap island outside 0–1</text>
<text x="420" y="210" fill="#94a3b8" font-size="17" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">Lightmap UVs should stay inside the unit square.</text>
</svg>