<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">Duplicate faces</title>
<desc id="desc">Illustration for Duplicate faces</desc>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="20" y="20" width="760" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
<text x="40" y="58" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Duplicate faces</text>
<text x="40" y="84" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Problem illustration</text>
<text x="100" y="115" fill="#e5e7eb" font-size="20" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Two faces occupy the same place</text>
<polygon points="120,270 240,210 360,280 240,340" fill="#f59e0b22" stroke="#f59e0b" stroke-width="3"/>
<polygon points="132,262 252,202 372,272 252,332" fill="#ef444433" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 7"/>
<line x1="376" y1="206" x2="404" y2="234" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
<line x1="404" y1="206" x2="376" y2="234" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
<text x="414" y="226" fill="#e5e7eb" font-size="18" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">Z-fighting / duplicate face</text>
<text x="100" y="375" fill="#94a3b8" font-size="15" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">Same area, slightly offset outline shows the hidden duplicate.</text>
</svg>