<text x="415" y="190" fill="#e5e7eb" font-size="22" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">No dedicated lightmap channel</text>
<text x="415" y="223" fill="#94a3b8" font-size="16" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">UE needs a valid UV channel for baked lighting.</text>
