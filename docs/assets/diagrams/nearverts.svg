<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">Nearby vertices</title>
<desc id="desc">Illustration for Nearby vertices</desc>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="20" y="20" width="760" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
<text x="40" y="58" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Nearby vertices</text>
<text x="40" y="84" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Problem illustration</text>
<polygon points="170,250 260,160 330,270" fill="none" stroke="#38bdf8" stroke-width="3"/>
<polygon points="230,290 320,230 390,310" fill="none" stroke="#38bdf8" stroke-width="3"/>
<circle cx="260" cy="160" r="8" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"/>
<circle cx="272" cy="168" r="8" fill="#ef4444" stroke="#ef4444" stroke-width="1"/>
<line x1="260" y1="160" x2="272" y2="168" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="420" y="182" fill="#e5e7eb" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Vertices are very close</text>
<text x="420" y="215" fill="#94a3b8" font-size="16" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">May indicate accidental doubles or tiny sliver geometry.</text>
</svg>