<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">UV overlap</title>
<desc id="desc">Illustration for UV overlap</desc>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="20" y="20" width="760" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
<text x="40" y="58" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">UV overlap</text>
<text x="40" y="84" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Problem illustration</text>
<rect x="100" y="110" width="250" height="220" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
<polygon points="140,170 240,140 280,220 175,260" fill="#38bdf822" stroke="#38bdf8" stroke-width="3"/>
<polygon points="180,160 295,155 305,245 200,255" fill="#ef444444" stroke="#ef4444" stroke-width="3"/>
<text x="430" y="180" fill="#e5e7eb" font-size="25" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">UV islands overlap</text>
<text x="430" y="214" fill="#94a3b8" font-size="16" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">Useful for mirroring sometimes, but often a texturing issue.</text>
</svg>