<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Unapplied scale versus unit scale">
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#283347" stroke-width=".8"/></pattern>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#5bd6bf" stroke-width="1.8"/></marker>
  <marker id="red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#fb7f80" stroke-width="1.8"/></marker></defs>
  <rect width="900" height="320" rx="22" fill="#111827"/><rect width="900" height="320" rx="22" fill="url(#grid)" opacity=".58"/>
  <text x="225" y="50" fill="#e5edf7" font-size="26" font-family="Arial, sans-serif" text-anchor="middle">Scale not applied</text><text x="677" y="50" fill="#e5edf7" font-size="26" font-family="Arial, sans-serif" text-anchor="middle">Unit scale</text><rect x="132.5" y="125.5" width="185" height="95" rx="8" fill="#ec9b70" fill-opacity=".19" stroke="#ec9b70" stroke-width="4"/><path d="M225 263 V93 M105 263 H345" stroke="#60788a" stroke-width="2" stroke-dasharray="7 5"/><text x="225" y="289" fill="#ec9b70" font-size="19" font-family="Arial, sans-serif" text-anchor="middle">Scale ≠ (1, 1, 1)</text><rect x="612.5" y="110.5" width="125" height="125" rx="8" fill="#5bd6bf" fill-opacity=".19" stroke="#5bd6bf" stroke-width="4"/><path d="M675 263 V93 M555 263 H795" stroke="#60788a" stroke-width="2" stroke-dasharray="7 5"/><text x="675" y="289" fill="#5bd6bf" font-size="19" font-family="Arial, sans-serif" text-anchor="middle">Scale = (1, 1, 1)</text>
  </svg>