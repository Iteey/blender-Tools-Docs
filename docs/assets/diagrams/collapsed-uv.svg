<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">Collapsed UV faces</title>
<desc id="desc">Illustration for Collapsed UV faces</desc>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="20" y="20" width="760" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
<text x="40" y="58" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Collapsed UV faces</text>
<text x="40" y="84" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Problem illustration</text>
<rect x="90" y="130" width="260" height="180" rx="4" fill="none" stroke="#1f2937" stroke-width="3"/>
<polygon points="170,220 171,220 172,220 173,220" fill="none" stroke="#ef4444" stroke-width="10"/>
<line x1="153" y1="202" x2="189" y2="238" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
<line x1="189" y1="202" x2="153" y2="238" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
<text x="400" y="180" fill="#e5e7eb" font-size="22" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">UV face collapsed to a line / point</text>
<text x="400" y="215" fill="#94a3b8" font-size="17" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">The polygon has no usable UV area for texturing.</text>
</svg>