<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Face winding along shared mesh edge">
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#283347" stroke-width=".8"/></pattern>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#5bd6bf" stroke-width="1.8"/></marker>
  <marker id="red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#fb7f80" stroke-width="1.8"/></marker></defs>
  <rect width="900" height="320" rx="22" fill="#111827"/><rect width="900" height="320" rx="22" fill="url(#grid)" opacity=".58"/>
  <text x="225" y="52" fill="#e5edf7" font-size="26" font-family="Arial, sans-serif" text-anchor="middle">Consistent</text><polygon points="105,110 225,110 225,245" fill="#143c46" stroke="#57c7c1" stroke-width="3" stroke-linejoin="round"/><polygon points="225,110 345,110 225,245" fill="#143c46" stroke="#57c7c1" stroke-width="3" stroke-linejoin="round"/><path d="M226 130 V225" stroke="#5bd6bf" stroke-width="5" marker-end="url(#arrow)"/><path d="M239 225 V130" stroke="#5bd6bf" stroke-width="5" marker-end="url(#arrow)"/><text x="225" y="288" fill="#81ccc5" font-size="17" font-family="Arial, sans-serif" text-anchor="middle">Opposite directions</text><text x="675" y="52" fill="#e5edf7" font-size="26" font-family="Arial, sans-serif" text-anchor="middle">Inconsistent</text><polygon points="555,110 675,110 675,245" fill="#143c46" stroke="#57c7c1" stroke-width="3" stroke-linejoin="round"/><polygon points="675,110 795,110 675,245" fill="#3c2a3e" stroke="#fb7f80" stroke-width="3" stroke-linejoin="round"/><path d="M676 130 V225" stroke="#5bd6bf" stroke-width="5" marker-end="url(#arrow)"/><path d="M689 130 V225" stroke="#fb7f80" stroke-width="5" marker-end="url(#red)"/><text x="675" y="288" fill="#ff9292" font-size="17" font-family="Arial, sans-serif" text-anchor="middle">Same direction</text>
  </svg>