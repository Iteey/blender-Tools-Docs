<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">N-gons</title>
<desc id="desc">Illustration for N-gons</desc>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="20" y="20" width="760" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
<text x="40" y="58" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">N-gons</text>
<text x="40" y="84" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Problem illustration</text>
<polygon points="180,130 280,120 350,180 330,280 240,320 145,280 120,190" fill="#ef444422" stroke="#ef4444" stroke-width="4"/>
<text x="240" y="365" fill="#ef4444" font-size="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700">7-sided face</text>
<text x="430" y="185" fill="#e5e7eb" font-size="28" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">N-gon</text>
<text x="430" y="220" fill="#94a3b8" font-size="17" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">A face has more than 4 vertices.</text>
</svg>