<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="ttl desc">
<title id="ttl">Degenerate geometry</title>
<desc id="desc">Illustration for Degenerate geometry</desc>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect x="20" y="20" width="760" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
<text x="40" y="58" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Degenerate geometry</text>
<text x="40" y="84" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Problem illustration</text>
<polygon points="150,300 270,160 272,161" fill="#ef444422" stroke="#ef4444" stroke-width="5"/>
<line x1="262" y1="151" x2="282" y2="171" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
<line x1="282" y1="151" x2="262" y2="171" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
<text x="380" y="185" fill="#e5e7eb" font-size="24" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="700">Degenerate triangle</text>
<text x="380" y="218" fill="#94a3b8" font-size="17" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-weight="400">Area is almost zero; vertices or edges collapse together.</text>
</svg>